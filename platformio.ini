[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM3
build_src_filter = +<file_share/>

[platformio]
src_dir = firmware
default_envs = esp32s3eye_tuned

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
build_src_filter = +<file_share/>
build_flags = -DUSE_INTERNAL_FLASH

[env:esp32s3eye]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
upload_flags = --no-stub
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_s3.csv
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
  adafruit/Adafruit GFX Library@1.13.0
build_src_filter = +<file_share/>
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DS3_EYE_SD

[env:esp32s3eye_tuned]
extends = env:esp32s3eye
framework = arduino, espidf
board_build.sdkconfig_defaults = sdkconfig.tuned.defaults
